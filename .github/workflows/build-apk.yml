name: Build TTS Pool Tracker APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '12266719'
          accept-android-sdk-licenses: true
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Inject Google credentials and validate
        env:
          GOOGLE_CREDENTIALS_B64: ${{ secrets.GOOGLE_CREDENTIALS_B64 }}
        run: |
          test -n "$GOOGLE_CREDENTIALS_B64" || (echo "::error::Missing GOOGLE_CREDENTIALS_B64 repository secret"; exit 1)
          mkdir -p app/src/main/assets
          echo "$GOOGLE_CREDENTIALS_B64" | base64 --decode > app/src/main/assets/SOC-Google-API-credentials.json
          python -m json.tool app/src/main/assets/SOC-Google-API-credentials.json >/dev/null
          python - <<'PY'
          import json
          p='app/src/main/assets/SOC-Google-API-credentials.json'
          with open(p, encoding='utf-8') as f: c=json.load(f)
          required=['type','project_id','private_key','client_email','token_uri']
          missing=[k for k in required if not c.get(k)]
          if missing:
              raise SystemExit('Missing credential fields: ' + ', '.join(missing))
          if c.get('type') != 'service_account':
              raise SystemExit('Credential type is not service_account')
          print('Credential JSON: VALID')
          print('Credential type: service_account')
          print('Project ID: ' + c['project_id'])
          print('Client email: ' + c['client_email'])
          print('Private key: PRESENT (value hidden)')
          print('Token URI: ' + c['token_uri'])
          PY

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/TTS-Pool-Tracker.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TTS-Pool-Tracker
          path: app/build/outputs/apk/debug/TTS-Pool-Tracker.apk
