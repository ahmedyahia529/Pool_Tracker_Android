plugins { id 'com.android.application' }

android {
    // AndroidX is enabled via gradle.properties in CI/build environments.
    namespace 'com.ahmedyahia.ttspooltracker'
    compileSdk 35

    defaultConfig {
        applicationId 'com.ahmedyahia.ttspooltracker'
        minSdk 23
        targetSdk 35
        versionCode 12
        versionName '3.1'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.core:core:1.15.0'
    implementation 'androidx.work:work-runtime:2.10.1'
}
