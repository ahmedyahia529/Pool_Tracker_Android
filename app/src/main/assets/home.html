<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta charset="utf-8"><title>TTS Pool Tracker Login</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(135deg,#06101d,#0d1a2d 55%,#081322);color:#e8eef8;font:14px "Segoe UI",Arial,sans-serif;display:flex;align-items:center;justify-content:center;padding:18px}.card{width:min(440px,100%);background:rgba(17,27,46,.97);border:1px solid #24344f;border-radius:22px;padding:28px 22px;box-shadow:0 24px 70px #0008}.logo{text-align:center;font-size:25px;font-weight:900;letter-spacing:.8px}.sub{text-align:center;color:#8ea0b8;margin:8px 0 25px}.field{margin:13px 0}.field label{display:block;color:#8ea0b8;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;margin-bottom:7px}input,select{width:100%;padding:14px 12px;border-radius:11px;border:1px solid #2a3c59;background:#0a1424;color:#e8eef8;outline:none;font-size:14px}input:focus,select:focus{border-color:#55c2ff88;box-shadow:0 0 0 3px #55c2ff12}.btn{width:100%;padding:14px;border-radius:11px;border:1px solid #55c2ff66;background:#55c2ff16;color:#8fd7ff;font-weight:900;font-size:14px;margin-top:10px}.btn.secondary{border-color:#36d39955;background:#36d39912;color:#74e3b4}.btn:disabled{opacity:.45}.status{text-align:center;min-height:22px;margin-top:14px;color:#8ea0b8;font-size:12px;line-height:1.5}.status.bad{color:#ff8b99}.status.ok{color:#74e3b4}.report-box{margin-top:20px;padding-top:18px;border-top:1px solid #ffffff12}.report-label{font-size:12px;color:#8ea0b8;margin-bottom:7px;font-weight:700}.latest{margin-top:8px;color:#8ea0b8;font-size:11px;text-align:center}.foot{margin-top:24px;color:#687991;font-size:11px;text-align:center}</style></head><body><div class="card"><div class="logo">◈ TTS POOL TRACKER</div><div class="sub">Secure NOC Mobile Report Viewer · v2.2</div><div id="loginBox"><div class="field"><label>Username</label><input id="username" autocomplete="username" spellcheck="false"></div><div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password"></div><button class="btn" id="loginBtn" onclick="login()">LOGIN</button><div id="status" class="status">Initializing Android connection…</div></div><div id="reportsBox" style="display:none"><div class="status ok" id="welcome"></div><div class="report-box"><div class="report-label">REPORT DAY</div><select id="reportSelect"></select><button class="btn secondary" id="selectedBtn" onclick="openSelected()">OPEN SELECTED REPORT</button><button class="btn" onclick="getLatest()">GET LAST REPORT UPDATE</button><div class="latest" id="latestInfo"></div></div><button class="btn" style="margin-top:20px" onclick="logout()">LOGOUT</button></div><div class="foot">Developed By Ahmed Yahia · TTS Pool Tracker</div></div><script>let authenticatedUser="",reports=[];function setStatus(s,cls=""){const e=document.getElementById("status");e.className="status "+cls;e.textContent=s}function onNativeReady(){setStatus("Android connection ready. Enter your credentials.","ok")}function login(){const u=document.getElementById("username").value.trim(),p=document.getElementById("password").value;if(!u||!p){setStatus("Enter username and password.","bad");return}document.getElementById("loginBtn").disabled=true;setStatus("Connecting to Google…");if(window.Android&&typeof Android.login==='function'){Android.login(u,p)}else{setStatus("Android bridge unavailable. Reinstall the latest APK.","bad");document.getElementById("loginBtn").disabled=false}}function onLoginSuccess(username,rawReports){authenticatedUser=username;try{reports=JSON.parse(rawReports||"[]")}catch(e){reports=[]}document.getElementById("loginBox").style.display="none";document.getElementById("reportsBox").style.display="block";document.getElementById("welcome").textContent="Authorized user: "+username;renderReports()}function onLoginError(msg){document.getElementById("loginBtn").disabled=false;setStatus(msg||"Login failed.","bad")}function renderReports(){const s=document.getElementById("reportSelect");s.innerHTML="";if(!reports.length){const o=document.createElement("option");o.textContent="No reports found";o.value="";s.appendChild(o);document.getElementById("selectedBtn").disabled=true;document.getElementById("latestInfo").textContent="No session reports are currently available.";return}reports.forEach((r,i)=>{const o=document.createElement("option");o.value=r.date;o.textContent=r.date+(i===0?" · LATEST UPDATE":"");s.appendChild(o)});document.getElementById("latestInfo").textContent=reports.length+" daily report(s) available on Google Drive.")}function openSelected(){const d=document.getElementById("reportSelect").value;if(d&&window.Android&&Android.getReportByDate)Android.getReportByDate(d)}function getLatest(){if(window.Android&&Android.getLatestReport)Android.getLatestReport()}function logout(){authenticatedUser="";reports=[];document.getElementById("reportsBox").style.display="none";document.getElementById("loginBox").style.display="block";document.getElementById("username").value="";document.getElementById("password").value="";document.getElementById("loginBtn").disabled=false;setStatus("Logged out.")}function showLoading(){setStatus("Loading report from Google Drive…")}function showError(m){setStatus(m||"Unable to load report.","bad")}window.addEventListener('load',function(){setTimeout(function(){if(window.Android&&typeof Android.ping==='function')Android.ping();else setStatus("Android bridge unavailable. Reinstall the latest APK.","bad")},100)})</script></body></html>
