<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><meta charset="utf-8"><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(135deg,#08101d,#0e1728 55%,#0a1424);color:#e8eef8;font:14px Arial,sans-serif;display:grid;place-items:center}.card{width:min(430px,calc(100% - 28px));background:#111b2e;border:1px solid #24344f;border-radius:22px;padding:30px 24px;text-align:center;box-shadow:0 24px 70px #0008}.logo{font-size:28px;font-weight:900;letter-spacing:1px}.sub{color:#8ea0b8;margin:9px 0 28px}.btn{width:100%;padding:16px;border-radius:13px;border:1px solid #55c2ff66;background:#55c2ff16;color:#8fd7ff;font-weight:900;font-size:15px;letter-spacing:.4px}.btn:active{transform:scale(.99)}.status{min-height:22px;margin-top:18px;color:#8ea0b8;font-size:12px}.foot{margin-top:34px;color:#687991;font-size:11px}</style></head><body><div class="card"><div class="logo">◈ TTS POOL TRACKER</div><div class="sub">NOC Mobile Report Viewer</div><button class="btn" onclick="getReport()">GET LAST UPDATE REPORT</button><div id="status" class="status">Today's latest report from Google Drive</div><div class="foot">Developed By Ahmed Yahia</div></div><script>function getReport(){document.getElementById('status').textContent='Connecting to Google Drive…';if(window.Android&&Android.getLatestReport){Android.getLatestReport()}else{document.getElementById('status').textContent='Android bridge unavailable.'}}function setStatus(s){document.getElementById('status').textContent=s}</script></body></html>
