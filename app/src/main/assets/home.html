<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta charset="utf-8"><title>TTS Pool Tracker Login</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(135deg,#06101d,#0d1a2d 55%,#081322);color:#e8eef8;font:14px "Segoe UI",Arial,sans-serif;display:flex;align-items:center;justify-content:center;padding:18px}.card{width:min(440px,100%);background:rgba(17,27,46,.97);border:1px solid #24344f;border-radius:22px;padding:28px 22px;box-shadow:0 24px 70px #0008}.logo{text-align:center;font-size:25px;font-weight:900;letter-spacing:.8px}.sub{text-align:center;color:#8ea0b8;margin:8px 0 25px}.field{margin:13px 0}.field label{display:block;color:#8ea0b8;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;margin-bottom:7px}input{width:100%;padding:14px 12px;border-radius:11px;border:1px solid #2a3c59;background:#0a1424;color:#e8eef8;outline:none;font-size:14px}input:focus{border-color:#55c2ff88;box-shadow:0 0 0 3px #55c2ff12}.btn{width:100%;padding:14px;border-radius:11px;border:1px solid #55c2ff66;background:#55c2ff16;color:#8fd7ff;font-weight:900;font-size:14px;margin-top:10px}.status{text-align:center;min-height:22px;margin-top:14px;color:#8ea0b8;font-size:12px;line-height:1.5}.status.bad{color:#ff8b99}.status.ok{color:#74e3b4}.foot{margin-top:24px;color:#687991;font-size:11px;text-align:center}</style></head><body><div class="card"><div class="logo">◈ TTS POOL TRACKER</div><div class="sub">Secure NOC Mobile Report Viewer · v2.6</div><div id="loginBox"><form action="https://tts.local/login" method="GET" onsubmit="document.getElementById('username').value=document.getElementById('username').value.replace(/\uFEFF|\u200B/g,'').trim();"><div class="field"><label>Username</label><input id="username" name="username" autocomplete="username" spellcheck="false"></div><div class="field"><label>Password</label><input id="password" name="password" type="password" autocomplete="current-password"></div><button class="btn" type="submit">LOGIN</button></form><div id="status" class="status">Ready. Enter your credentials and press LOGIN.</div></div><div class="foot">Developed By Ahmed Yahia · TTS Pool Tracker</div></div></body></html>
