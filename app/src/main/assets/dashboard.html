<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TTS Sentinel | NOC Dashboard</title>
<style>
:root{
 --bg:#08101d;--panel:#111b2e;--panel2:#0d1728;--text:#e8eef8;--muted:#8ea0b8;
 --line:#24344f;--accent:#55c2ff;--ok:#36d399;--warn:#f6c453;--bad:#ff6678;
 --unable:#ff6678;--speed:#55c2ff;--logical:#a78bfa;--browsing:#36d399;--option:#f6c453;--iptv:#fb7185;--technical:#f97316;--other:#94a3b8;
}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(135deg,#08101d,#0e1728 55%,#0a1424);color:var(--text);font:14px "Segoe UI",Arial,sans-serif}
.wrap{max-width:1500px;margin:auto;padding:24px}
.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;gap:18px}
h1{margin:0;font-size:26px;letter-spacing:.5px}.sub{color:var(--muted);margin-top:5px}
.live{display:flex;align-items:center;gap:8px;color:var(--ok);font-weight:600}.dot{width:9px;height:9px;background:var(--ok);border-radius:50%;box-shadow:0 0 12px var(--ok)}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:14px}
.card{background:rgba(17,27,46,.92);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:0 10px 30px #0003}
.label{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:1px}.num{font-size:30px;font-weight:700;margin-top:6px}.accent{color:var(--accent)}
.two{display:grid;grid-template-columns:1.45fr 1fr;gap:14px}.panel{background:rgba(17,27,46,.92);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}.panel h2{font-size:15px;margin:0 0 14px}.panel-title-row{display:flex;align-items:center;justify-content:space-between;gap:10px}.panel-title-row h2{margin:0}.sortbtn{border:1px solid #55c2ff66;background:#55c2ff14;color:#8fd7ff;border-radius:9px;padding:7px 10px;font-size:11px;font-weight:800;cursor:pointer;white-space:nowrap}.sortbtn:hover{background:#55c2ff2b}
.bars{display:grid;gap:10px}.barrow{display:grid;grid-template-columns:120px 1fr 55px;gap:10px;align-items:center}.track{height:10px;background:#0a1322;border-radius:99px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,#3fa7e8,#66d7c2);border-radius:99px}
.table{width:100%;border-collapse:collapse}.table th,.table td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}.table th{color:var(--muted);font-size:11px;text-transform:uppercase;white-space:nowrap}.table tbody tr:hover{background:#ffffff05}.ok{color:var(--ok)}.bad{color:var(--bad)}.empty{color:var(--muted);padding:18px;text-align:center}
.chart{height:330px;position:relative;margin-top:4px}.chart svg{width:100%;height:100%;overflow:visible}.chartgrid{stroke:#24344f;stroke-width:1}.chartaxis{stroke:#334762;stroke-width:1}.chartline{fill:none;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.chartdot{stroke:#08101d;stroke-width:2;cursor:pointer}.chart-hit{fill:transparent;stroke:transparent;cursor:pointer;pointer-events:all}
.category-grand-total,.daily-chart-grand-total{display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding:12px 14px;border:1px solid rgba(255,255,255,.09);border-radius:12px;background:rgba(255,255,255,.035);color:var(--muted)}.category-grand-total b,.daily-chart-grand-total b{font-size:18px;color:#fff}
.tt-row{display:flex;justify-content:space-between;gap:20px;padding:5px 0;border-top:1px solid rgba(255,255,255,.08)}.tt-section{margin-top:10px;padding-top:9px;border-top:1px solid rgba(255,255,255,.12);font-weight:700;color:#fff}.tt-ticket{padding:3px 0;line-height:1.45}.chartdot:hover{stroke:#fff;stroke-width:3}.chartlabel{fill:#8ea0b8;font-size:11px}.chartx{fill:#8ea0b8;font-size:10px;text-anchor:middle}
.legend{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 2px}.legend-item{display:flex;align-items:center;gap:7px;color:#cbd6e8;font-size:12px;cursor:pointer;padding:5px 8px;border:1px solid transparent;border-radius:8px;user-select:none}.legend-item:hover{border-color:var(--line);background:#ffffff06}.legend-item.off{opacity:.38;text-decoration:line-through}.legend-swatch{width:11px;height:11px;border-radius:50%;box-shadow:0 0 8px #0005}
.chart-tooltip{position:fixed;z-index:20;pointer-events:none;display:none;min-width:180px;max-width:280px;background:#08101df5;border:1px solid #3a4e6c;border-radius:10px;padding:10px 12px;box-shadow:0 12px 30px #0008}.chart-tooltip .tt-title{font-weight:700;margin-bottom:5px}.chart-tooltip .tt-value{font-size:18px;font-weight:800}.chart-tooltip .tt-meta{color:var(--muted);font-size:11px;margin-top:3px}.chart-tooltip .tt-tickets{margin-top:8px;display:grid;gap:5px;max-height:220px;overflow:auto}.chart-tooltip .tt-ticket{font-size:11px;line-height:1.35;padding-top:4px;border-top:1px solid #ffffff10}.chart-tooltip .tt-ticket a{color:#8fd7ff;text-decoration:none;font-weight:800}.chart-tooltip .tt-ticket a:hover{text-decoration:underline}
.category-totals{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:12px}.category-total{background:linear-gradient(145deg,#0d1728,#101d31);border:1px solid var(--line);border-radius:11px;padding:11px;box-shadow:inset 0 1px 0 #ffffff08}.category-total .ct-label{font-size:11px;color:var(--muted)}.category-total .ct-value{font-size:20px;font-weight:800;margin-top:3px}.category-total .ct-arrow{font-size:14px;color:var(--muted);padding:0 2px}.category-total .ct-service-label{font-size:9px;color:var(--muted);margin-top:3px}
.daily-category-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.daily-category-card{background:linear-gradient(145deg,#0d1728,#101d31);border:1px solid var(--line);border-radius:12px;padding:12px}.daily-category-title{font-weight:800;margin-bottom:8px}.daily-bar-row{display:grid;grid-template-columns:110px 1fr 42px;gap:8px;align-items:center;margin:7px 0}.daily-bar-label{color:#cbd6e8;font-size:11px}.daily-bar-value{text-align:right;font-weight:800}.daily-bar-track{height:8px;background:#0a1322;border-radius:99px;overflow:hidden}.daily-bar-fill{height:100%;border-radius:99px}
.history-control{display:flex;align-items:center;gap:8px}.history-control label{color:var(--muted);font-size:10px;font-weight:800;letter-spacing:.8px}.history-control select{min-width:145px;border:1px solid var(--line);border-radius:9px;background:#0d1728;color:var(--text);padding:9px 11px;outline:none}.logoutbtn{border:1px solid #a78bfa66;background:#a78bfa14;color:#c7b7ff}.logoutbtn:hover{background:#a78bfa2b}.dangerbtn{border:1px solid #ff667866;background:#ff667814;color:#ff8b99}.dangerbtn:hover{background:#ff66782b}.reportbtn{border:1px solid #55c2ff66;background:#55c2ff14;color:#8fd7ff}.reportbtn:hover{background:#55c2ff2b}.foot{color:var(--muted);font-size:12px;text-align:center;padding:10px}.app-footer{color:var(--muted);font-size:12px;text-align:center;padding:18px 10px;margin-top:20px;border-top:1px solid rgba(255,255,255,.08)}.app-footer strong{color:#ffffff;font-weight:600}.footer-separator{margin:0 8px;opacity:.5}
@media print{@page{size:A4 landscape;margin:10mm}body{background:#fff;color:#111;font-size:10px;-webkit-print-color-adjust:exact;print-color-adjust:exact}.wrap{max-width:none;padding:0}.head{margin-bottom:10px}.head>div:last-child .live,.reportbtn,.dangerbtn,.logoutbtn,.sortbtn,.history-control{display:none!important}.panel,.card{background:#fff;border:1px solid #bbb;box-shadow:none;break-inside:avoid}.panel{margin-bottom:8px;padding:10px}.card{padding:10px}.two,.ticket-layout{gap:8px}.table th,.table td{padding:5px 6px;border-bottom:1px solid #ccc}.table th{color:#555}.table tbody tr:hover{background:transparent}.table-scroll{overflow:visible;max-height:none}.repeat-list{max-height:none;overflow:visible}.chart{height:260px}.chart-tooltip{display:none!important}.app-footer{color:#555;border-top:1px solid #ccc}a{color:#111;text-decoration:none}}
@media(max-width:1150px){.grid{grid-template-columns:repeat(3,1fr)}.category-totals{grid-template-columns:repeat(4,1fr)}}
@media(max-width:1000px){.grid{grid-template-columns:repeat(2,1fr)}.two,.three,.ticket-layout,.daily-category-grid{grid-template-columns:1fr}.head{display:block}.live{margin-top:10px}.barrow{grid-template-columns:100px 1fr 45px}}
@media(max-width:600px){.iptv-detail-grid{grid-template-columns:1fr}.wrap{padding:12px}.grid{grid-template-columns:1fr}.category-totals{grid-template-columns:repeat(2,1fr)}.chart{height:290px}.daily-bar-row{grid-template-columns:88px 1fr 36px}}
</style></head>
<body><div class="wrap"><div class="head"><div><h1>◈ TTS SENTINEL</h1><div class="sub">TTS Pool Operations Intelligence Dashboard</div></div><div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end"><div class="history-control"><label for="daySelect">REPORT DAY</label><select id="daySelect" onchange="changeDay(this.value)"><option>Loading...</option></select></div><div class="live"><span class="dot"></span> LIVE · Mobile Report</div><button class="reportbtn" onclick="downloadReport()">⬇ Download Report</button><button class="logoutbtn" onclick="logoutDashboard()">⇥ Logout</button></div></div><div id="syncStatus" class="sync-status">☁ Report loaded from TTS Sentinel</div><div id="app">Loading...</div><div id="chartTooltip" class="chart-tooltip"></div><div id="iptvTicketModal" class="iptv-ticket-modal" onclick="if(event.target===this)closeIptvTicketModal()"></div><div class="foot">Report structure and calculations mirror the TTS Sentinel desktop dashboard.</div><footer class="app-footer"><span>Developed By:</span> <strong>Ahmed Yahia</strong><span class="footer-separator">•</span><span>TTS POOL Tracker</span></footer></div>
<script>
const n=v=>Number(v||0).toLocaleString();function pct(v){return Math.round((Number(v)||0)*100)+"%"}function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]))}
const CHART_CATEGORIES=[{key:"Unable",color:"#ff6678"},{key:"Speed",color:"#55c2ff"},{key:"Logical",color:"#a78bfa"},{key:"Browsing",color:"#36d399"},{key:"Option Pack",color:"#f6c453"},{key:"IPTV",color:"#fb7185"},{key:"Technical",color:"#f97316"},{key:"Other",color:"#94a3b8"}];
function uniqueCategoryTotals(runs){const out={};CHART_CATEGORIES.forEach(c=>out[c.key]=new Set());for(const r of runs||[]){const ids=r.dashboard_category_ticket_ids||{};for(const c of CHART_CATEGORIES){for(const id of(ids[c.key]||[])){if(id)out[c.key].add(String(id));}}}const result={};for(const c of CHART_CATEGORIES)result[c.key]=out[c.key].size;return result}
function chartPointData(runs){const hist=(runs||[]).slice(-24);const vals=[];for(const r of hist){const x=r.dashboard_category_counts||{};for(const c of CHART_CATEGORIES)vals.push(Number(x[c.key]||0));}return{hist,max:Math.max(...vals,1)}}
function showChartTip(ev,category,value,run,time,newCount,encodedDetails,encodedServiceCounts){let details=[];try{details=encodedDetails?JSON.parse(decodeURIComponent(encodedDetails)):[]}catch(e){details=[]}let serviceCounts={};try{serviceCounts=encodedServiceCounts?JSON.parse(decodeURIComponent(encodedServiceCounts)):{} }catch(e){serviceCounts={}}const ftth=Number((serviceCounts.FTTH||{})[category]||0);const xdsl=Number((serviceCounts["ADSL/VDSL"]||{})[category]||0);const serviceTotal=ftth+xdsl;const tip=document.getElementById('chartTooltip');let html=`<div class="tt-title">Run #${esc(run)}</div><div class="tt-meta">${esc(time)}</div><div class="tt-row"><span>Category</span><b>${esc(category)}</b></div><div class="tt-row"><span>Tickets This Run</span><b>${n(value)}</b></div><div class="tt-row"><span>FTTH / xDSL</span><b>${n(ftth)} / ${n(xdsl)}</b></div><div class="tt-row"><span>Service Total</span><b>${n(serviceTotal)}</b></div><div class="tt-row"><span>New This Run</span><b>${n(newCount)}</b></div>`;if(category==='Other'&&Array.isArray(details)&&details.length){const unique=[];const seen=new Set();for(const item of details){const id=String(item?.ticket_id||'').trim();const title=String(item?.ticket_title||'').trim();const key=`${id}|${title}`;if(!seen.has(key)){seen.add(key);unique.push({id,title});}}if(unique.length){html+=`<div class="tt-section">Other Tickets</div><div class="tt-tickets">${unique.map(x=>`<div class="tt-ticket"><a href="http://tts/new/index.php/tickets/edit_ticket?ticket_id=${encodeURIComponent(x.id)}" target="_blank">${esc(x.id)}</a> · ${esc(x.title||'No title')}</div>`).join('')}</div>`;}}tip.innerHTML=html;tip.style.display='block';const pad=14,rect=tip.getBoundingClientRect();let x=ev.clientX+16,y=ev.clientY+16;if(x+rect.width>window.innerWidth-pad)x=ev.clientX-rect.width-16;if(y+rect.height>window.innerHeight-pad)y=ev.clientY-rect.height-16;tip.style.left=x+'px';tip.style.top=y+'px'}
function hideChartTip(){document.getElementById('chartTooltip').style.display='none'}function bindChartHover(){document.querySelectorAll('.chart-hit').forEach(hit=>{hit.addEventListener('mouseenter',e=>{const el=e.currentTarget;showChartTip(e,el.dataset.category,Number(el.dataset.value||0),el.dataset.run||'',el.dataset.time||'',Number(el.dataset.new||0),el.dataset.details||'',el.dataset.services||'')});hit.addEventListener('mousemove',e=>{const el=e.currentTarget;showChartTip(e,el.dataset.category,Number(el.dataset.value||0),el.dataset.run||'',el.dataset.time||'',Number(el.dataset.new||0),el.dataset.details||'',el.dataset.services||'')});hit.addEventListener('mouseleave',hideChartTip)})}
const hiddenCategories=new Set();let highGroupSortDesc=true,currentTicketSortDesc=true,lastDashboardData=null;function toggleCategory(category){if(hiddenCategories.has(category))hiddenCategories.delete(category);else hiddenCategories.add(category);if(lastDashboardData)render(lastDashboardData)}function toggleHighGroupSort(){highGroupSortDesc=!highGroupSortDesc;if(lastDashboardData)render(lastDashboardData)}function toggleCurrentTicketSort(){currentTicketSortDesc=!currentTicketSortDesc;if(lastDashboardData)render(lastDashboardData)}
function buildChart(runs,sessionTotals){const{hist,max}=chartPointData(runs);const W=1100,H=310,L=52,R=24,T=18,B=42,plotW=W-L-R,plotH=H-T-B,xStep=hist.length>1?plotW/(hist.length-1):plotW,xFor=i=>hist.length>1?L+i*xStep:L+plotW/2,yFor=v=>T+plotH-(Number(v||0)/max)*plotH;let grid=[];for(let i=0;i<=4;i++){const y=T+(plotH*i/4),value=Math.round(max-(max*i/4));grid.push(`<line class="chartgrid" x1="${L}" y1="${y}" x2="${W-R}" y2="${y}"/><text class="chartlabel" x="${L-9}" y="${y+4}" text-anchor="end">${n(value)}</text>`)}const xLabels=hist.map((r,i)=>{const x=xFor(i),label=String(r.ended_at||'').slice(11,16)||('R'+r.run_number);return`<text class="chartx" x="${x}" y="${H-15}">${esc(label)}</text>`}).join('');let series='';for(const c of CHART_CATEGORIES){if(hiddenCategories.has(c.key))continue;const pts=hist.map((r,i)=>`${xFor(i)},${yFor((r.dashboard_category_counts||{})[c.key])}`).join(' ');series+=`<polyline class="chartline" style="stroke:${c.color}" points="${pts}"/>`;hist.forEach((r,i)=>{const v=Number((r.dashboard_category_counts||{})[c.key]||0),x=xFor(i),y=yFor(v),details=((r.dashboard_category_ticket_details||{})[c.key]||[]),encodedDetails=encodeURIComponent(JSON.stringify(details)),serviceCounts=r.dashboard_service_category_counts||{},encodedServices=encodeURIComponent(JSON.stringify(serviceCounts));series+=`<circle class="chartdot" style="fill:${c.color}" cx="${x}" cy="${y}" r="5"/><circle class="chart-hit" cx="${x}" cy="${y}" r="12" data-category="${esc(c.key)}" data-value="${v}" data-run="${esc(String(r.run_number))}" data-time="${esc(String(r.ended_at||''))}" data-new="${Number(r.new_ticket_count||0)}" data-details="${encodedDetails}" data-services="${encodedServices}"/>`})}const legend=CHART_CATEGORIES.map(c=>`<div class="legend-item ${hiddenCategories.has(c.key)?'off':''}" onclick="toggleCategory('${esc(c.key)}')"><span class="legend-swatch" style="background:${c.color}"></span>${esc(c.key)}</div>`).join('');return`<div class="chart"><svg viewBox="0 0 ${W} ${H}">${grid.join('')}${xLabels}${series}</svg></div><div class="legend">${legend}</div>`}
function buildSmartAlerts(t){const a=t.smart_alerts||t.repeated_cabinet_alerts||[];return`<div class="panel"><div class="panel-title-row"><h2>Repeated Cabinet Alerts</h2><span class="section-badge">DAILY</span></div>${a.length?`<div class="repeat-list">${a.map(x=>`<div class="repeat-item"><b>${esc(x.cabinet||x.Cabinet||'-')}</b><span class="sub">${esc(x.reason||x.message||'Repeated cabinet')}</span></div>`).join('')}</div>`:'<div class="empty">No repeated cabinet alerts.</div>'}</div>`}
function buildHourlyHeatmap(t){const h=t.hourly_heatmap||t.hourly_category_heatmap||{};const cats=CHART_CATEGORIES.map(x=>x.key);const hours=Object.keys(h).sort();if(!hours.length)return`<div class="panel"><h2>Hourly Escalation Heatmap</h2><div class="empty">No hourly heatmap data.</div></div>`;return`<div class="panel"><h2>Hourly Escalation Heatmap</h2><div class="table-scroll"><table class="table"><thead><tr><th>Category</th>${hours.map(x=>`<th>${esc(x)}</th>`).join('')}</tr></thead><tbody>${cats.map(c=>`<tr><th>${esc(c)}</th>${hours.map(x=>{const v=h[x]?.[c]??h[c]?.[x]??0;return`<td>${n(v)||''}</td>`}).join('')}</tr>`).join('')}</tbody></table></div></div>`}
function buildRankings(t){const r=t.rankings||t.category_rankings||[];if(!r.length)return'';return`<div class="panel"><h2>Category Rankings</h2><div class="table-scroll"><table class="table"><thead><tr><th>Category</th><th>Count</th></tr></thead><tbody>${r.map(x=>`<tr><td>${esc(x.category||x.name||'-')}</td><td>${n(x.count||x.total)}</td></tr>`).join('')}</tbody></table></div></div>`}
function escTicket(x){return String(x||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function buildTicketRows(rows,desc=true){return(rows||[]).slice().sort((a,b)=>{const av=Number(a.GroupCount??a.group_count??0),bv=Number(b.GroupCount??b.group_count??0);return desc?bv-av:av-bv}).slice(0,25).map(x=>`<tr><td>${escTicket(x.ticket_id||x.ticket||x.id||'-')}</td><td>${escTicket(x.account||x.AccountNum||'-')}</td><td>${escTicket(x.product||x.Product||'-')}</td><td>${escTicket(x.category||x.Category||'-')}</td><td>${escTicket(x.cabinet||x.Cabinet_Host_Name||'-')}</td><td>${escTicket(x.transfer_date||x.transfer_time||'-')}</td><td>${n(x.GroupCount??x.group_count)}</td></tr>`).join('')}
function render(d){lastDashboardData=d;const reportDay=d.session_date||selectedDate||'',c=d.current||{},t=d.session_totals||{},cats=c.categories||{},iptv=c.iptv_status||{},total=Number(c.total_tickets||0),seen=Number(t.unique_accounts_seen||0),runs=(d.runs||[]).length;const ticketDetails=c.ticket_details||[],highGroup=t.high_group_tickets||c.high_group_tickets||[];document.getElementById('sub').textContent=`TTS Pool Operations Intelligence · ${reportDay} · Updated ${d.last_updated||'-'}`;const categoryTotal=Object.values(cats).reduce((a,v)=>a+Number(v||0),0);document.getElementById('app').innerHTML=`<div class="grid"><div class="card"><div class="label">Current Tickets</div><div class="num accent">${n(total)}</div></div><div class="card"><div class="label">Unique Accounts</div><div class="num">${n(seen)}</div></div><div class="card"><div class="label">New This Run</div><div class="num ok">+${n(c.new_ticket_count||0)}</div></div><div class="card"><div class="label">Runs</div><div class="num">${n(runs)}</div></div><div class="card"><div class="label">Category Total</div><div class="num">${n(categoryTotal)}</div></div></div><div class="two"><div class="panel"><h2>Pool Composition</h2><div class="bars">${Object.entries(cats).map(([k,v])=>`<div class="barrow"><span>${esc(k)}</span><div class="track"><div class="fill" style="width:${total?Math.min(100,Number(v||0)/total*100):0}%"></div></div><b>${n(v)}</b></div>`).join('')}</div></div><div class="panel"><h2>Session Intelligence</h2><table class="table"><tbody><tr><td>Session started</td><td>${esc(d.started_at||'-')}</td></tr><tr><td>Last update</td><td>${esc(d.last_updated||'-')}</td></tr><tr><td>Peak pool</td><td>${n(t.peak_current_tickets)}</td></tr><tr><td>Unique cabinets</td><td>${n(t.unique_cabinets_seen)}</td></tr><tr><td>Repeated cabinets</td><td>${n(c.repeated_cabinets||t.repeated_cabinets)}</td></tr></tbody></table></div></div><div class="panel"><div class="panel-title-row"><h2>Category Trend · Last 24 Runs</h2></div>${buildChart(d.runs||[],t)}</div><div class="panel"><h2>Daily Category Analytics</h2><div class="category-totals">${CHART_CATEGORIES.map(x=>`<div class="category-total"><div class="ct-label">${esc(x.key)}</div><div class="ct-value">${n(cats[x.key]||0)}</div></div>`).join('')}</div></div>${buildSmartAlerts(t)}${buildHourlyHeatmap(t)}${buildRankings(t)}<div class="ticket-layout"><div class="panel ticket-panel"><div class="panel-title-row"><h2>Current Ticket Detail · Top 25</h2><button class="sortbtn" onclick="toggleCurrentTicketSort()">GroupCount: ${currentTicketSortDesc?'DESC ↓':'ASC ↑'}</button></div><div class="table-scroll"><table class="table"><thead><tr><th>Ticket</th><th>Account</th><th>Product</th><th>Category</th><th>Cabinet</th><th>TransferDate</th><th>GroupCount</th></tr></thead><tbody>${buildTicketRows(ticketDetails,currentTicketSortDesc)||'<tr><td colspan="7" class="empty">No ticket details available</td></tr>'}</tbody></table></div></div><div class="panel ticket-panel"><div class="panel-title-row"><h2>High Group Tickets · GroupCount ≥ 5 <span class="section-badge">DAILY</span></h2><button class="sortbtn" onclick="toggleHighGroupSort()">GroupCount: ${highGroupSortDesc?'DESC ↓':'ASC ↑'}</button></div><div class="sub" style="margin-bottom:10px">All unique tickets with GroupCount ≥ 5 detected during the selected day's runs.</div><div class="table-scroll"><table class="table"><thead><tr><th>Ticket</th><th>Account</th><th>Product</th><th>Category</th><th>Cabinet</th><th>GroupCount</th><th>Transfer Time</th><th>First Run</th><th>Last Run</th></tr></thead><tbody>${(highGroup||[]).slice().sort((a,b)=>{const av=Number(a.GroupCount??a.group_count??0),bv=Number(b.GroupCount??b.group_count??0);return highGroupSortDesc?bv-av:av-bv}).slice(0,100).map(x=>`<tr><td>${escTicket(x.ticket_id||x.ticket||x.id||'-')}</td><td>${escTicket(x.account||x.AccountNum||'-')}</td><td>${escTicket(x.product||x.Product||'-')}</td><td>${escTicket(x.category||x.Category||'-')}</td><td>${escTicket(x.cabinet||x.Cabinet_Host_Name||'-')}</td><td>${n(x.GroupCount??x.group_count)}</td><td>${escTicket(x.transfer_time||x.transfer_date||'-')}</td><td>${escTicket(x.first_run||'-')}</td><td>${escTicket(x.last_run||'-')}</td></tr>`).join('')||'<tr><td colspan="9" class="empty">No tickets with GroupCount ≥ 5 detected today.</td></tr>'}</tbody></table></div></div></div>`;bindChartHover()}
let selectedDate='';let availableDays=[];
function loadSyncStatus(){const el=document.getElementById('syncStatus');if(el){el.className='sync-status ok';el.textContent='☁ Report loaded from TTS Sentinel';}}
function loadHistory(){availableDays=Array.isArray(window.ANDROID_REPORTS)?window.ANDROID_REPORTS.map(x=>String(x.date||x)).filter(Boolean):[];const select=document.getElementById('daySelect');select.innerHTML=availableDays.length?availableDays.map(day=>`<option value="${esc(day)}">${esc(day)}</option>`).join(''):'<option value="">No reports</option>';if(!selectedDate||!availableDays.includes(selectedDate))selectedDate=window.ANDROID_SELECTED_DATE||availableDays[0]||'';select.value=selectedDate;refresh()}
function changeDay(day){selectedDate=day||'';if(!selectedDate)return;if(window.Android&&Android.getReportByDate)Android.getReportByDate(selectedDate)}
function refresh(){try{if(window.ANDROID_REPORT_DATA)render(window.ANDROID_REPORT_DATA);else document.getElementById('app').innerHTML='<div class="panel bad">Report data is unavailable.</div>'}catch(e){document.getElementById('app').innerHTML='<div class="panel bad">Unable to render report: '+esc(e.message||e)+'</div>'}}
function onReportLoaded(raw){try{window.ANDROID_REPORT_DATA=typeof raw==='string'?JSON.parse(raw):raw;render(window.ANDROID_REPORT_DATA)}catch(e){document.getElementById('app').innerHTML='<div class="panel bad">Unable to load report: '+esc(e.message||e)+'</div>'}}
function downloadReport(){const oldTitle=document.title;document.title='TTS POOL Tracker - Daily Report - '+(selectedDate||new Date().toISOString().slice(0,10));window.print();setTimeout(()=>{document.title=oldTitle},1000)}
function logoutDashboard(){if(window.Android&&Android.backHome)Android.backHome();else location.reload()}
loadHistory();loadSyncStatus();
</script></body></html>
