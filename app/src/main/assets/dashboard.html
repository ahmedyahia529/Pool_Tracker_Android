<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>TTS Pool Tracker</title>
<style>
:root{--bg:#07111e;--panel:#101b2d;--line:#263752;--text:#eaf1fb;--muted:#8ea0b8;--accent:#55c2ff;--ok:#36d399;--warn:#f6c453;--bad:#ff6678}*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#06101d,#0c1829 55%,#081321);color:var(--text);font:13px Segoe UI,Arial,sans-serif}.wrap{max-width:1200px;margin:auto;padding:12px}.head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.head h1{font-size:20px;margin:0}.sub{color:var(--muted);font-size:11px;margin-top:4px}.btn{border:1px solid #55c2ff55;background:#55c2ff14;color:#8fd7ff;border-radius:9px;padding:8px 11px;font-weight:800}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}.card,.panel{background:rgba(16,27,45,.94);border:1px solid var(--line);border-radius:12px;padding:12px;box-shadow:0 8px 25px #0003}.label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.7px}.num{font-size:24px;font-weight:800;margin-top:4px}.accent{color:var(--accent)}.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.panel{margin-top:10px}.two .panel{margin-top:0}.panel h2{font-size:14px;margin:0 0 10px}.bars{display:grid;gap:7px}.bar{display:grid;grid-template-columns:85px 1fr 32px;gap:7px;align-items:center}.track{height:8px;background:#091321;border-radius:20px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,#55c2ff,#36d399);border-radius:20px}.table-scroll{overflow-x:auto}.table{width:100%;border-collapse:collapse;min-width:650px}.table th,.table td{padding:7px;border-bottom:1px solid #ffffff0d;text-align:left;vertical-align:top}.table th{font-size:10px;color:var(--muted);text-transform:uppercase;white-space:nowrap}.badge{display:inline-block;padding:3px 7px;border-radius:99px;border:1px solid #ffffff1a;color:var(--muted);font-size:9px;font-weight:800}.ticket{color:#8fd7ff;text-decoration:none;font-weight:800}.empty{text-align:center;color:var(--muted);padding:18px}.repeat{display:grid;gap:7px}.repeat-item{padding:9px;border:1px solid #ffffff0d;border-radius:9px;background:#0d1728}.repeat-name{font-weight:800}.repeat-meta{font-size:10px;color:var(--muted);margin-top:3px}.heat{overflow-x:auto}.heat table{border-collapse:separate;border-spacing:3px;min-width:700px}.heat td,.heat th{padding:6px;text-align:center;font-size:9px;border-radius:4px}.heat th{color:var(--muted)}.heat .name{text-align:left;min-width:90px}.foot{text-align:center;color:#64758d;padding:18px 0;font-size:10px}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}.grid .card:last-child{grid-column:span 2}.two{grid-template-columns:1fr}.two .panel{margin-top:10px}.head h1{font-size:18px}}@media(max-width:480px){.wrap{padding:9px}.grid{grid-template-columns:1fr 1fr;gap:7px}.card{padding:10px}.num{font-size:21px}.head{align-items:flex-start}.head .btn{padding:7px 8px}.bar{grid-template-columns:72px 1fr 28px;font-size:10px}}
</style></head><body><div class="wrap"><div class="head"><div><h1>◈ TTS POOL TRACKER</h1><div class="sub" id="sub">Mobile report viewer</div></div><button class="btn" onclick="backHome()">← Reports</button></div><div id="app"><div class="panel empty">Loading report…</div></div><div class="foot">Developed By Ahmed Yahia · TTS Pool Tracker</div></div>
<script>
let D=null;function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function n(v){return Number(v||0)}function arr(v){return Array.isArray(v)?v:[]}function link(t){let id=esc(t.ticket_id||t.id||t.ticket||'');let h=t.href||t.ticket_href||'';return h?`<a class="ticket" href="${esc(h)}">${id||'Ticket'}</a>`:id}
function categories(t){let c=t.category_totals||t.categories||{};return {Unable:n(c.Unable),Speed:n(c.Speed),Logical:n(c.Logical),Browsing:n(c.Browsing),"Option Pack":n(c['Option Pack']),IPTV:n(c.IPTV),Technical:n(c.Technical),Other:n(c.Other)}}
function runRows(r){return arr(r).slice().reverse().slice(0,15).map(x=>`<tr><td>${n(x.run_number)}</td><td>${esc(x.ended_at||x.started_at||'-')}</td><td>${n(x.current_tickets||x.current_pool_tickets)}</td><td class="ok">+${n(x.new_ticket_count||x.new_tickets)}</td><td>${esc(x.duration||'-')}</td></tr>`).join('')}
function ticketRows(r){return arr(r).slice().sort((a,b)=>n(b.GroupCount||b.group_count)-n(a.GroupCount||a.group_count)).slice(0,25).map(x=>`<tr><td>${link(x)}</td><td>${esc(x.account||x.AccountNum||'-')}</td><td>${esc(x.product||x.Product||'-')}</td><td>${esc(x.category||x.Category||'-')}</td><td>${esc(x.cabinet||x.Cabinet_Host_Name||'-')}</td><td>${esc(x.transfer_date||x.transfer_time||'-')}</td><td><span class="badge">${n(x.GroupCount||x.group_count)}</span></td></tr>`).join('')}
function highRows(r){return arr(r).filter(x=>n(x.group_count||x.GroupCount)>=5).sort((a,b)=>n(b.group_count||b.GroupCount)-n(a.group_count||a.GroupCount)).slice(0,50).map(x=>`<tr><td>${link(x)}</td><td>${esc(x.account||x.AccountNum||'-')}</td><td>${esc(x.product||x.Product||'-')}</td><td>${esc(x.category||x.Category||'-')}</td><td>${esc(x.cabinet||x.Cabinet_Host_Name||'-')}</td><td class="warn">${n(x.group_count||x.GroupCount)}</td><td>${esc(x.transfer_time||x.transfer_date||'-')}</td></tr>`).join('')}
function repeats(a){return arr(a).map(x=>`<div class="repeat-item"><div class="repeat-name">${esc(x.cabinet||'-')}</div><div class="repeat-meta">${esc(x.detected_at||x.last_seen||'-')} · ${n(x.count||x.occurrences)} occurrences${x.cards&&x.cards.length?' · Cards: '+esc(x.cards.join(', ')):''}</div></div>`).join('')}
function heatmap(t){let h=t.hourly_heatmap||t.hourly_category_heatmap||{};let cats=['Unable','Speed','Logical','Browsing','Option Pack','IPTV','Technical','Other'];let hours=Object.keys(h).sort();if(!hours.length)return '<div class="empty">No hourly heatmap data.</div>';return `<div class="heat"><table><tr><th class="name">Category</th>${hours.map(x=>`<th>${esc(x)}</th>`).join('')}</tr>${cats.map(c=>`<tr><th class="name">${c}</th>${hours.map(x=>{let v=h[x]?.[c]??h[c]?.[x]??0;let z=Math.min(1,n(v)/5);return `<td style="background:rgba(85,194,255,${.08+z*.72})">${n(v)||''}</td>`}).join('')}</tr>`).join('')}</table></div>`}
function render(d){D=d||{};let t=d.totals||d.session_totals||{};let c=d.counts||d.current_counts||{};let cats=categories(t);let max=Math.max(1,...Object.values(cats));let total=n(t.current_tickets||t.current_pool_tickets||d.current_ticket_count);let seen=n(t.tickets_seen_today||t.unique_customers_seen||d.tickets_seen_today);let runs=arr(d.runs);let current=arr(d.current_ticket_details||d.ticket_details||d.tickets);let high=arr(d.high_group_tickets||t.high_group_tickets);let repeatsAll=arr(d.sheet_repeated_cabinet_alerts||d.repeated_cabinet_alerts);let poolRepeats=arr(d.pool_repeated_cabinet_history||t.pool_repeated_cabinet_history);document.getElementById('sub').textContent=`Report: ${esc(d.session_date||'-')} · Updated: ${esc(d.last_updated||'-')}`;document.getElementById('app').innerHTML=`<div class="grid"><div class="card"><div class="label">Current Tickets</div><div class="num accent">${total}</div><div class="sub">TTS pool</div></div><div class="card"><div class="label">Tickets Seen Today</div><div class="num">${seen}</div><div class="sub">Unique customers</div></div><div class="card"><div class="label">New This Run</div><div class="num ok">+${n(t.new_tickets_this_run||d.new_tickets_this_run)}</div></div><div class="card"><div class="label">Runs</div><div class="num">${runs.length||n(t.runs_completed)}</div></div><div class="card"><div class="label">Near Violation</div><div class="num ${n(c.near_violation||t.near_violation)>0?'bad':'ok'}">${n(c.near_violation||t.near_violation)}</div><div class="sub">≥ 90 minutes</div></div></div><div class="two"><div class="panel"><h2>Pool Composition</h2><div class="bars">${Object.entries(cats).map(([k,v])=>`<div class="bar"><span>${esc(k)}</span><div class="track"><div class="fill" style="width:${Math.min(100,v/max*100)}%"></div></div><b>${v}</b></div>`).join('')}</div></div><div class="panel"><h2>Session Intelligence</h2><table class="table"><tr><td>Session started</td><td>${esc(d.started_at||'-')}</td></tr><tr><td>Last update</td><td>${esc(d.last_updated||'-')}</td></tr><tr><td>Peak pool</td><td>${n(t.peak_current_tickets)}</td></tr><tr><td>Unique cabinets</td><td>${n(t.unique_cabinets_seen)}</td></tr><tr><td>Repeated cabinets</td><td>${n(c.repeated_cabinets||t.repeated_cabinets)}</td></tr></table></div></div><div class="panel"><h2>Latest Runs</h2><div class="table-scroll"><table class="table"><tr><th>#</th><th>Time</th><th>Current</th><th>New</th><th>Duration</th></tr>${runRows(runs)||'<tr><td colspan="5" class="empty">No runs.</td></tr>'}</table></div></div><div class="panel"><h2>Daily Category Analytics</h2><div class="bars">${Object.entries(cats).map(([k,v])=>`<div class="bar"><span>${esc(k)}</span><div class="track"><div class="fill" style="width:${Math.min(100,v/max*100)}%"></div></div><b>${v}</b></div>`).join('')}</div></div><div class="panel"><h2>Hourly Escalation Heatmap</h2>${heatmap(t)}</div><div class="panel"><h2>Repeated Cabinet Alerts <span class="badge">DAILY</span></h2><div class="repeat">${repeats(repeatsAll)||'<div class="empty">No repeated cabinets.</div>'}</div></div><div class="panel"><h2>TTS Pool Repeated Cabinets <span class="badge">DAILY</span></h2><div class="repeat">${repeats(poolRepeats)||'<div class="empty">No repeated cabinets in TTS pool.</div>'}</div></div><div class="panel"><h2>Current Ticket Detail · Top 25</h2><div class="table-scroll"><table class="table"><tr><th>Ticket</th><th>Account</th><th>Product</th><th>Category</th><th>Cabinet</th><th>Transfer</th><th>GroupCount</th></tr>${ticketRows(current)||'<tr><td colspan="7" class="empty">No ticket details.</td></tr>'}</table></div></div><div class="panel"><h2>High Group Tickets · GroupCount ≥ 5</h2><div class="table-scroll"><table class="table"><tr><th>Ticket</th><th>Account</th><th>Product</th><th>Category</th><th>Cabinet</th><th>GroupCount</th><th>Transfer</th></tr>${highRows(high)||'<tr><td colspan="7" class="empty">No high-group tickets.</td></tr>'}</table></div></div>`}
function onReportLoaded(raw){try{render(typeof raw==='string'?JSON.parse(raw):raw)}catch(e){document.getElementById('app').innerHTML='<div class="panel bad">Unable to parse report.</div>'}}
function backHome(){if(window.Android&&Android.backHome)Android.backHome();else history.back()}
function showLoading(){document.getElementById('app').innerHTML='<div class="panel empty">Loading report from Google Drive…</div>'}
function showError(m){document.getElementById('app').innerHTML=`<div class="panel bad"><h2>Report unavailable</h2><div class="sub">${esc(m||'Unable to load report.')}</div></div>`}
</script></body></html>
