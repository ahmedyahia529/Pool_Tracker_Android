x;max-width:280px;background:#08101df5;border:1px solid #3a4e6c;border-radius:10px;padding:10px 12px;box-shadow:0 12px 30px #0008}.chart-tooltip .tt-title{font-weight:700;margin-bottom:5px}.chart-tooltip .tt-value{font-size:18px;font-weight:800}.chart-tooltip .tt-meta{color:var(--muted);font-size:11px;margin-top:3px}.chart-tooltip .tt-tickets{margin-top:8px;display:grid;gap:5px;max-height:220px;overflow:auto}.chart-tooltip .tt-ticket{font-size:11px;line-height:1.35;padding-top:4px;border-top:1px solid #ffffff10}.chart-tooltip .tt-ticket a{color:#8fd7ff;text-decoration:none;font-weight:800}.category-totals{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:12px}.category-total{background:linear-gradient(145deg,#0d1728,#101d31);border:1px solid var(--line);border-radius:11px;padding:11px}.category-total .ct-label{font-size:11px;color:var(--muted)}.category-total .ct-value{font-size:20px;font-weight:800;margin-top:3px}.daily-category-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.daily-category-card{background:linear-gradient(145deg,#0d1728,#101d31);border:1px solid var(--line);border-radius:12px;padding:12px}.daily-category-title{font-weight:800;margin-bottom:8px}.daily-bar-row{display:grid;grid-template-columns:110px 1fr 42px;gap:8px;align-items:center;margin:7px 0}.history-control{display:flex;align-items:center;gap:8px}.history-control label{color:var(--muted);font-size:10px;font-weight:800;letter-spacing:.8px}.history-control select{min-width:145px;border:1px solid var(--line);border-radius:9px;background:#0d1728;color:var(--text);padding:9px 11px;outline:none}.logoutbtn,.reportbtn,.dangerbtn{border-radius:9px;padding:8px 11px;font-weight:800}.logoutbtn{border:1px solid #a78bfa66;background:#a78bfa14;color:#c7b7ff}.reportbtn{border:1px solid #55c2ff66;background:#55c2ff14;color:#8fd7ff}.dangerbtn{border:1px solid #ff667866;background:#ff667814;color:#ff8b99}.foot,.app-footer{color:var(--muted);font-size:12px;text-align:center;padding:10px}.app-footer{padding:18px 10px;margin-top:20px;border-top:1px solid rgba(255,255,255,.08)}.app-footer strong{color:#fff}.footer-separator{margin:0 8px;opacity:.5}.sync-status{margin:0 0 12px;padding:8px 12px;border:1px solid var(--line);border-radius:9px;background:#0d1728;color:var(--muted);font-size:11px}.sync-status.ok{color:#8fe3bd;border-color:#36d39944}.repeat-list{display:grid;gap:8px}.repeat-item{padding:10px;border:1px solid #ffffff12;border-radius:10px;background:#0d1728}.section-badge{font-size:9px;padding:3px 6px;border-radius:99px;border:1px solid #ffffff22;color:var(--muted)}.ticket-layout{display:grid;grid-template-columns:1fr 1fr;gap:14px}.table-scroll{overflow-x:auto}.iptv-detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.iptv-ticket-modal,.cabinet-modal{display:none}@media(max-width:1150px){.grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:1000px){.grid{grid-template-columns:repeat(2,1fr)}.two,.ticket-layout,.daily-category-grid{grid-template-columns:1fr}.head{display:block}.live{margin-top:10px}}@media(max-width:600px){.wrap{padding:12px}.grid{grid-template-columns:1fr}.category-totals{grid-template-columns:repeat(2,1fr)}.chart{height:290px}.barrow{grid-template-columns:90px 1fr 42px}.history-control{margin-bottom:8px}}
</style></head><body><div class="wrap"><div class="head"><div><h1>◈ TTS SENTINEL</h1><div class="sub">TTS Pool Operations Intelligence Dashboard</div></div><div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end"><div class="history-control"><label for="daySelect">REPORT DAY</label><select id="daySelect" onchange="changeDay(this.value)"><option>Loading...</option></select></div><div class="live"><span class="dot"></span> LIVE · Mobile Report</div><button class="reportbtn" onclick="downloadReport()">⬇ Download Report</button><button class="logoutbtn" onclick="logoutDashboard()">⇥ Logout</button></div></div><div id="syncStatus" class="sync-status">☁ Report loaded from TTS Sentinel</div><div id="app">Loading...</div><div id="chartTooltip" class="chart-tooltip"></div><div id="iptvTicketModal" class="iptv-ticket-modal"></div><div class="foot">Mobile viewer uses the same session JSON and dashboard calculations as TTS Sentinel.</div><footer class="app-footer"><span>Developed By:</span> <strong>Ahmed Yahia</strong><span class="footer-separator">•</span><span>TTS POOL Tracker</span></footer></div><script>
const n=v=>Number(v||0).toLocaleString();function pct(v){return Math.round((Number(v)||0)*100)+"%"}function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]))}
const CHART_CATEGORIES=[{key:"Unable",color:"#ff6678"},{key:"Speed",color:"#55c2ff"},{key:"Logical",color:"#a78bfa"},{key:"Browsing",color:"#36d399"},{key:"Option Pack",color:"#f6c453"},{key:"IPTV",color:"#fb7185"},{key:"Technical",color:"#f97316"},{key:"Other",color:"#94a3b8"}];
function uniqueCategoryTotals(runs){const out={};CHART_CATEGORIES.forEach(c=>out[c.key]=new Set());for(const r of runs||[]){const ids=r.dashboard_category_ticket_ids||{};for(const c of CHART_CATEGORIES){for(const id of(ids[c.key]||[])){if(id)out[c.key].add(String(id));}}}const result={};for(const c of CHART_CATEGORIES)result[c.key]=out[c.key].size;return result}
function chartPointData(runs){const hist=(runs||[]).slice(-24);const vals=[];for(const r of hist){const x=r.dashboard_category_counts||{};for(const c of CHART_CATEGORIES)vals.push(Number(x[c.key]||0));}return{hist,max:Math.max(...vals,1)}}
function showChartTip(ev,category,value,run,time,newCount,encodedDetails,encodedServiceCounts){let details=[];try{details=encodedDetails?JSON.parse(decodeURIComponent(encodedDetails)):[]}catch(e){details=[]}let serviceCounts={};try{serviceCounts=encodedServiceCounts?JSON.parse(decodeURIComponent(encodedServiceCounts)):{} }catch(e){serviceCounts={}}const ftth=Number((serviceCounts.FTTH||{})[category]||0);const xdsl=Number((serviceCounts["ADSL/VDSL"]||{})[category]||0);const serviceTotal=ftth+xdsl;const tip=document.getElementById('chartTooltip');let html=`<div class="tt-title">Run #${esc(run)}</div><div class="tt-meta">${esc(time)}</div><div class="tt-row"><span>Category</span><b>${esc(category)}</b></div><div class="tt-row"><span>Tickets This Run</span><b>${n(value)}</b></div><div class="tt-row"><span>FTTH / xDSL</span><b>${n(ftth)} / ${n(xdsl)}</b></div><div class="tt-row"><span>Service Total</span><b>${n(serviceTotal)}</b></div><div class="tt-row"><span>New This Run</span><b>${n(newCount)}</b></div>`;tip.innerHTML=html;tip.style.display='block';tip.style.left=(ev.clientX+16)+'px';tip.style.top=(ev.clientY+16)+'px'}
function hideChartTip(){document.getElementById('chartTooltip').style.display='none'}function bindChartHover(){document.querySelectorAll('.chart-hit').forEach(hit=>{hit.addEventListener('mouseenter',e=>{const el=e.currentTarget;showChartTip(e,el.dataset.category,Number(el.dataset.value||0),el.dataset.run||'',el.dataset.time||'',Number(el.dataset.new||0),el.dataset.details||'',el.dataset.services||'')});hit.addEventListener('mousemove',e=>{const el=e.currentTarget;showChartTip(e,el.dataset.category,Number(el.dataset.value||0),el.dataset.run||'',el.dataset.time||'',Number(el.dataset.new||0),el.dataset.details||'',el.dataset.services||'')});hit.addEventListener('mouseleave',hideChartTip)})}
function toggleCategory(category){if(hiddenCategories.has(category))hiddenCategories.delete(category);else hiddenCategories.add(category);if(lastDashboardData)render(lastDashboardData)}
function buildChart(runs,sessionTotals){const{hist,max}=chartPointData(runs);const W=1100,H=310,L=52,R=24,T=18,B=42,plotW=W-L-R,plotH=H-T-B,xStep=hist.length>1?plotW/(hist.length-1):plotW,xFor=i=>hist.length>1?L+i*xStep:L+plotW/2,yFor=v=>T+plotH-(Number(v||0)/max)*plotH;let grid=[];for(let i=0;i<=4;i++){const y=T+(plotH*i/4),value=Math.round(max-(max*i/4));grid.push(`<line class="chartgrid" x1="${L}" y1="${y}" x2="${W-R}" y2="${y}"/><text class="chartlabel" x="${L-9}" y="${y+4}" text-anchor="end">${n(value)}</text>`)}const xLabels=hist.map((r,i)=>{const x=xFor(i),label=String(r.ended_at||'').slice(11,16)||('R'+r.run_number);return`<text class="chartx" x="${x}" y="${H-15}">${esc(label)}</text>`}).join('');let series='';for(const c of CHART_CATEGORIES){if(hiddenCategories.has(c.key))continue;const pts=hist.map((r,i)=>`${xFor(i)},${yFor((r.dashboard_category_counts||{})[c.key])}`).join(' ');series+=`<polyline class="chartline" style="stroke:${c.color}" points="${pts}"/>`;hist.forEach((r,i)=>{const v=Number((r.dashboard_category_counts||{})[c.key]||0),x=xFor(i),y=yFor(v);series+=`<circle class="chartdot" style="fill:${c.color}" cx="${x}" cy="${y}" r="5"/><circle class="chart-hit" cx="${x}" cy="${y}" r="12" data-category="${esc(c.key)}" data-value="${v}" data-run="${esc(String(r.run_number))}" data-time="${esc(String(r.ended_at||''))}" data-new="${Number(r.new_ticket_count||0)}"/>`})}const legend=CHART_CATEGORIES.map(c=>`<div class="legend-item ${hiddenCategories.has(c.key)?'off':''}" onclick="toggleCategory('${esc(c.key)}')"><span class="legend-swatch" style="background:${c.color}"></span>${esc(c.key)}</div>`).join('');return`<div class="chart"><svg viewBox="0 0 ${W} ${H}">${grid.join('')}${xLabels}${series}</svg></div><div class="legend">${legend}</div>`}
function buildSmartAlerts(t){const a=t.smart_alerts||t.repeated_cabinet_alerts||[];return`<div class="panel"><div class="panel-title-row"><h2>Repeated Cabinet Alerts</h2><span class="section-badge">DAILY</span></div>${a.length?`<div class="repeat-list">${a.map(x=>`<div class="repeat-item"><b>${esc(x.cabinet||x.Cabinet||'-')}</b><span class="sub">${esc(x.reason||x.message||'Repeated cabinet')}</span></div>`).join('')}</div>`:'<div class="empty">No repeated cabinet alerts.</div>'}</div>`}
function buildHourlyHeatmap(t){const h=t.hourly_heatmap||t.hourly_category_heatmap||{};const cats=CHART_CATEGORIES.map(x=>x.key);const hours=Object.keys(h).sort();if(!hours.length)return`<div class="panel"><h2>Hourly Escalation Heatmap</h2><div class="empty">No hourly heatmap data.</div></div>`;return`<div class="panel"><h2>Hourly Escalation Heatmap</h2><div class="table-scroll"><table class="table"><thead><tr><th>Category</th>${hours.map(x=>`<th>${esc(x)}</th>`).join('')}</tr></thead><tbody>${cats.map(c=>`<tr><th>${esc(c)}</th>${hours.map(x=>{const v=h[x]?.[c]??h[c]?.[x]??0;return`<td>${n(v)||''}</td>`}).join('')}</tr>`).join('')}</tbody></table></div></div>`}
function buildRankings(t){const r=t.rankings||t.category_rankings||[];if(!r.length)return'';return`<div class="panel"><h2>Category Rankings</h2><div class="table-scroll"><table class="table"><thead><tr><th>Category</th><th>Count</th></tr></thead><tbody>${r.map(x=>`<tr><td>${esc(x.category||x.name||'-')}</td><td>${n(x.count||x.total)}</td></tr>`).join('')}</tbody></table></div></div>`}
function buildIptvStatusPanel(x){return''}function buildIptvOurPoolPanel(x){return''}function buildIptvSecondaryPanel(x){return''}function bindCabinetClicks(){}function bindIptvTicketRows(){}
let selectedDate="";let availableDays=[];const hiddenCategories=new Set();let highGroupSortDesc=true;let currentTicketSortDesc=true;let lastDashboardData=null;function toggleHighGroupSort(){highGroupSortDesc=!highGroupSortDesc;if(lastDashboardData)render(lastDashboardData)}function toggleCurrentTicketSort(){currentTicketSortDesc=!currentTicketSortDesc;if(lastDashboardData)render(lastDashboardData)}
function render(d){lastDashboardData=d;const reportDay=d.session_date||selectedDate||"";const c=d.current||{},t=d.session_totals||{},cats=c.categories||{},iptv=c.iptv_status||{};const total=Number(c.total_tickets||0),seen=Number(t.unique_accounts_seen||0),runs=(d.runs||[]).length;const max=Math.max(...Object.values(cats).map(Number),1);const rows=(d.runs||[]).slice().reverse().slice(0,12).map(r=>`<tr><td>${esc(r.run_number)}</td><td>${esc(r.ended_at||"")}</td><td>${n(r.total_tickets||r.current_tickets||0)}</td><td class="ok">+${n(r.new_ticket_count||0)}</td><td>${esc(r.duration||"")}</td></tr>`).join('');const ticketRows=(c.ticket_details||[]).slice().sort((a,b)=>{const av=Number(a.GroupCount||a.group_count||0),bv=Number(b.GroupCount||b.group_count||0);return currentTicketSortDesc?bv-av:av-bv}).slice(0,25).map(x=>`<tr><td>${esc(x.ticket_id||x.ticket||x.id||"")}</td><td>${esc(x.account||x.AccountNum||"")}</td><td>${esc(x.product||x.Product||"")}</td><td>${esc(x.category||x.Category||"")}</td><td>${esc(x.cabinet||x.Cabinet_Host_Name||"")}</td><td>${esc(x.transfer_date||x.transfer_time||"")}</td><td>${n(x.GroupCount||x.group_count||0)}</td></tr>`).join('');const highGroupRows=(t.high_group_tickets||c.high_group_tickets||[]).slice().sort((a,b)=>{const av=Number(a.GroupCount||a.group_count||0),bv=Number(b.GroupCount||b.group_count||0);return highGroupSortDesc?bv-av:av-bv}).slice(0,100).map(x=>`<tr><td>${esc(x.ticket_id||x.ticket||x.id||"")}</td><td>${esc(x.account||x.AccountNum||"")}</td><td>${esc(x.product||x.Product||"")}</td><td>${esc(x.category||x.Category||"")}</td><td>${esc(x.cabinet||x.Cabinet_Host_Name||"")}</td><td>${n(x.GroupCount||x.group_count||0)}</td><td>${esc(x.transfer_time||x.transfer_date||"")}</td><td>${esc(x.first_run||"")}</td><td>${esc(x.last_run||"")}</td></tr>`).join('');document.getElementById('sub').textContent=`TTS Pool Operations Intelligence · ${reportDay} · Updated ${d.last_updated||'-'}`;document.getElementById('app').innerHTML=`<div class="grid"><div class="card"><div class="label">Current Tickets</div><div class="num accent">${n(total)}</div></div><div class="card"><div class="label">Unique Accounts</div><div class="num">${n(seen)}</div></div><div class="card"><div class="label">New This Run</div><div class="num ok">+${n(c.new_ticket_count||0)}</div></div><div class="card"><div class="label">Runs</div><div class="num">${n(runs)}</div></div><div class="card"><div class="label">Near Violation</div><div class="num ${Number(c.near_violation||t.near_violation||0)>0?'bad':'ok'}">${n(c.near_violation||t.near_violation||0)}</div></div></div><div class="two"><div class="panel"><h2>Pool Composition</h2><div class="bars">${Object.entries(cats).map(([k,v])=>`<div class="barrow"><span>${esc(k)}</span><div class="track"><div class="fill" style="width:${Math.min(100,Number(v||0)/max*100)}%"></div></div><b>${n(v)}</b></div>`).join('')}</div></div><div class="panel"><h2>Session Intelligence</h2><table class="table"><tbody><tr><td>Session started</td><td>${esc(d.started_at||'-')}</td></tr><tr><td>Last update</td><td>${esc(d.last_updated||'-')}</td></tr><tr><td>Peak pool</td><td>${n(t.peak_current_tickets)}</td></tr><tr><td>Unique cabinets</td><td>${n(t.unique_cabinets_seen)}</td></tr><tr><td>Repeated cabinets</td><td>${n(c.repeated_cabinets||t.repeated_cabinets)}</td></tr></tbody></table></div></div><div class="panel"><h2>Latest Runs</h2><div class="table-scroll"><table class="table"><thead><tr><th>#</th><th>Time</th><th>Current</th><th>New</th><th>Duration</th></tr></thead><tbody>${rows||'<tr><td colspan="5" class="empty">No runs.</td></tr>'}</tbody></table></div></div><div class="panel"><h2>Category Trend · Last 24 Runs</h2>${buildChart(d.runs||[],t)}</div><div class="panel"><h2>Daily Category Analytics</h2><div class="category-totals">${Object.entries(cats).map(([k,v])=>`<div class="category-total"><div class="ct-label">${esc(k)}</div><div class="ct-value">${n(v)}</div></div>`).join('')}</div></div>${buildSmartAlerts(t)}${buildHourlyHeatmap(t)}${buildRankings(t)}<div class="ticket-layout"><div class="panel ticket-panel"><div class="panel-title-row"><h2>Current Ticket Detail · Top 25</h2><button class="sortbtn" onclick="toggleCurrentTicketSort()">GroupCount: ${currentTicketSortDesc?'DESC ↓':'ASC ↑'}</button></div><div class="table-scroll"><table class="table"><thead><tr><th>Ticket</th><th>Account</th><th>Product</th><th>Category</th><th>Cabinet</th><th>TransferDate</th><th>GroupCount</th></tr></thead><tbody>${ticketRows||'<tr><td colspan="7" class="empty">No ticket details available</td></tr>'}</tbody></table></div></div><div class="panel ticket-panel"><div class="panel-title-row"><h2>High Group Tickets · GroupCount ≥ 5 <span class="section-badge">DAILY</span></h2><button class="sortbtn" onclick="toggleHighGroupSort()">GroupCount: ${highGroupSortDesc?'DESC ↓':'ASC ↑'}</button></div><div class="sub" style="margin-bottom:10px">All unique tickets with GroupCount ≥ 5 detected during the selected day's runs.</div><div class="table-scroll"><table class="table"><thead><tr><th>Ticket</th><th>Account</th><th>Product</th><th>Category</th><th>Cabinet</th><th>GroupCount</th><th>Transfer Time</th><th>First Run</th><th>Last Run</th></tr></thead><tbody>${highGroupRows||'<tr><td colspan="9" class="empty">No tickets with GroupCount ≥ 5 detected today.</td></tr>'}</tbody></table></div></div></div>`;bindChartHover();bindCabinetClicks();bindIptvTicketRows()}
function loadSyncStatus(){const el=document.getElementById('syncStatus');if(el){el.className='sync-status ok';el.textContent='☁ Report loaded from TTS Sentinel'}}
function syncToday(){alert('Online sync is managed by the main TTS Sentinel system.')}
function loadHistory(){availableDays=Array.isArray(window.ANDROID_REPORTS)?window.ANDROID_REPORTS.map(x=>String(x.date||x)).filter(Boolean):[];const select=document.getElementById('daySelect');select.innerHTML=availableDays.length?availableDays.map(day=>`<option value="${esc(day)}">${esc(day)}</option>`).join(''):'<option value="">No reports</option>';if(!selectedDate||!availableDays.includes(selectedDate))selectedDate=window.ANDROID_SELECTED_DATE||availableDays[0]||'';select.value=selectedDate;refresh()}
function changeDay(day){selectedDate=day||'';if(!selectedDate)return;if(window.Android&&Android.getReportByDate)Android.getReportByDate(selectedDate)}
function refresh(){try{if(window.ANDROID_REPORT_DATA)render(window.ANDROID_REPORT_DATA);else document.getElementById('app').innerHTML='<div class="panel bad">Report data is unavailable.</div>'}catch(e){document.getElementById('app').innerHTML='<div class="panel bad">Unable to render report: '+esc(e.message||e)+'</div>'}}
function onReportLoaded(raw){try{window.ANDROID_REPORT_DATA=typeof raw==='string'?JSON.parse(raw):raw;render(window.ANDROID_REPORT_DATA)}catch(e){document.getElementById('app').innerHTML='<div class="panel bad">Unable to load report: '+esc(e.message||e)+'</div>'}}
function downloadReport(){window.print()}
function logoutDashboard(){if(window.Android&&Android.backHome)Android.backHome();else location.reload()}
loadHistory();loadSyncStatus();
</script></body></html>
