us:99px}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}.table th{color:var(--muted);font-size:11px;text-transform:uppercase;white-space:nowrap}.table tbody tr:hover{background:#ffffff05}.ok{color:var(--ok)}.bad{color:var(--bad)}.empty{color:var(--muted);padding:18px;text-align:center}.chart{height:330px;position:relative;margin-top:4px}.chart svg{width:100%;height:100%;overflow:visible}.chartgrid{stroke:#24344f;stroke-width:1}.chartaxis{stroke:#334762;stroke-width:1}.chartline{fill:none;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.chartdot{stroke:#08101d;stroke-width:2;cursor:pointer}.chart-hit{fill:transparent;stroke:transparent;cursor:pointer;pointer-events:all}.category-grand-total,.daily-chart-grand-total{display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding:12px 14px;border:1px solid rgba(255,255,255,.09);border-radius:12px;background:rgba(255,255,255,.035);color:var(--muted)}.category-grand-total b,.daily-chart-grand-total b{font-size:18px;color:#fff}.tt-row{display:flex;justify-content:space-between;gap:20px;padding:5px 0;border-top:1px solid rgba(255,255,255,.08)}.tt-section{margin-top:10px;padding-top:9px;border-top:1px solid rgba(255,255,255,.12);font-weight:700;color:#fff}.tt-ticket{padding:3px 0;line-height:1.45}.chartdot:hover{stroke:#fff;stroke-width:3}.chartlabel{fill:#8ea0b8;font-size:11px}.chartx{fill:#8ea0b8;font-size:10px;text-anchor:middle}.legend{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 2px}.legend-item{display:flex;align-items:center;gap:7px;color:#cbd6e8;font-size:12px;cursor:pointer;padding:5px 8px;border:1px solid transparent;border-radius:8px;user-select:none}.legend-item.off{opacity:.38;text-decoration:line-through}.legend-swatch{width:11px;height:11px;border-radius:50%;box-shadow:0 0 8px #0005}.chart-tooltip{position:fixed;z-index:20;pointer-events:none;display:none;min-width:180px;max-width:280px;background:#08101df5;border:1px solid #3a4e6c;border-radius:10px;padding:10px 12px;box-shadow:0 12px 30px #0008}.chart-tooltip .tt-title{font-weight:700;margin-bottom:5px}.chart-tooltip .tt-value{font-size:18px;font-weight:800}.chart-tooltip .tt-meta{color:var(--muted);font-size:11px;margin-top:3px}.chart-tooltip .tt-tickets{margin-top:8px;display:grid;gap:5px;max-height:220px;overflow:auto}.chart-tooltip .tt-ticket{font-size:11px;line-height:1.35;padding-top:4px;border-top:1px solid #ffffff10}.chart-tooltip .tt-ticket a{color:#8fd7ff;text-decoration:none;font-weight:800}.category-totals{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:12px}.category-total{background:linear-gradient(145deg,#0d1728,#101d31);border:1px solid var(--line);border-radius:11px;padding:11px}.category-total .ct-label{font-size:11px;color:var(--muted)}.category-total .ct-value{font-size:20px;font-weight:800;margin-top:3px}.daily-category-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.daily-category-card{background:linear-gradient(145deg,#0d1728,#101d31);border:1px solid var(--line);border-radius:12px;padding:12px}.daily-category-title{font-weight:800;margin-bottom:8px}.daily-bar-row{display:grid;grid-template-columns:110px 1fr 42px;gap:8px;align-items:center;margin:7px 0}.history-control{display:flex;align-items:center;gap:8px}.history-control label{color:var(--muted);font-size:10px;font-weight:800;letter-spacing:.8px}.history-control select{min-width:145px;border:1px solid var(--line);border-radius:9px;background:#0d1728;color:var(--text);padding:9px 11px;outline:none}.logoutbtn,.reportbtn,.dangerbtn{border-radius:9px;padding:8px 11px;font-weight:800}.logoutbtn{border:1px solid #a78bfa66;background:#a78bfa14;color:#c7b7ff}.reportbtn{border:1px solid #55c2ff66;background:#55c2ff14;color:#8fd7ff}.dangerbtn{border:1px solid #ff667866;background:#ff667814;color:#ff8b99}.foot,.app-footer{color:var(--muted);font-size:12px;text-align:center;padding:10px}.app-footer{padding:18px 10px;margin-top:20px;border-top:1px solid rgba(255,255,255,.08)}.app-footer strong{color:#fff}.footer-separator{margin:0 8px;opacity:.5}.sync-status{margin:0 0 12px;padding:8px 12px;border:1px solid var(--line);border-radius:9px;background:#0d1728;color:var(--muted);font-size:11px}.sync-status.ok{color:#8fe3bd;border-color:#36d39944}.repeat-list{display:grid;gap:8px}.repeat-item{padding:10px;border:1px solid #ffffff12;border-radius:10px;background:#0d1728}.section-badge{font-size:9px;padding:3px 6px;border-radius:99px;border:1px solid #ffffff22;color:var(--muted)}.ticket-layout{display:grid;grid-template-columns:1fr 1fr;gap:14px}.table-scroll{overflow-x:auto}.iptv-detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.iptv-ticket-modal,.cabinet-modal{display:none}@media(max-width:1150px){.grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:1000px){.grid{grid-template-columns:repeat(2,1fr)}.two,.ticket-layout,.daily-category-grid{grid-template-columns:1fr}.head{display:block}.live{margin-top:10px}}@media(max-width:600px){.wrap{padding:12px}.grid{grid-template-columns:1fr}.category-totals{grid-template-columns:repeat(2,1fr)}.chart{height:290px}.barrow{grid-template-columns:90px 1fr 42px}.history-control{margin-bottom:8px}}

:9px;text-transform:uppercase;letter-spacing:.8px;margin-bottom:4px}.iptv-detail b{word-break:break-word}.iptv-ticket-id-link{color:#8fd7ff;font-weight:900;text-decoration:none}.iptv-ticket-id-link:hover{text-decoration:underline}.cabinet-modal,.iptv-ticket-modal{position:fixed;inset:0;background:rgba(0,0,0,.68);display:none;align-items:center;justify-content:center;z-index:1000;padding:20px}.cabinet-modal.show,.iptv-ticket-modal.show{display:flex}@media(max-width:600px){.iptv-detail-grid{grid-template-columns:1fr}}
</style></head><body><div class="wrap"><div class="head"><div><h1>◈ TTS SENTINEL</h1><div id="sub" class="sub">TTS Pool Operations Intelligence Dashboard</div></div><div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end"><div class="history-control"><label for="daySelect">REPORT DAY</label><select id="daySelect" onchange="changeDay(this.value)"><option>Loading...</option></select></div><div class="live"><span class="dot"></span> ONLINE · Google Drive Reports</div><button class="reportbtn" onclick="downloadReport()">⬇ Download Report</button><button class="logoutbtn" onclick="logoutDashboard()">⇥ Logout</button></div></div><div id="onlineStatus" class="sync-status">☁ Loading online reports…</div><div id="app">Loading...</div><div id="chartTooltip" class="chart-tooltip"></div><div id="iptvTicketModal" class="iptv-ticket-modal"></div><div class="foot">Mobile viewer uses the same session JSON and dashboard calculations as TTS Sentinel.</div><footer class="app-footer"><span>Developed By:</span> <strong>Ahmed Yahia</strong><span class="footer-separator">•</span><span>TTS POOL Tracker</span></footer></div><script>
const n=v=>Number(v||0).toLocaleString();function pct(v){return Math.round((Number(v)||0)*100)+"%"}function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]))}
const CHART_CATEGORIES=[{key:"Unable",color:"#ff6678"},{key:"Speed",color:"#55c2ff"},{key:"Logical",color:"#a78bfa"},{key:"Browsing",color:"#36d399"},{key:"Option Pack",color:"#f6c453"},{key:"IPTV",color:"#fb7185"},{key:"Technical",color:"#f97316"},{key:"Other",color:"#94a3b8"}];
function uniqueCategoryTotals(runs){const out={};CHART_CATEGORIES.forEach(c=>out[c.key]=new Set());for(const r of runs||[]){const ids=r.dashboard_category_ticket_ids||{};for(const c of CHART_CATEGORIES){for(const id of(ids[c.key]||[])){if(id)out[c.key].add(String(id));}}}const result={};for(const c of CHART_CATEGORIES)result[c.key]=out[c.key].size;return result}
function chartPointData(runs){const hist=(runs||[]).slice(-24);const vals=[];for(const r of hist){const x=r.dashboard_category_counts||{};for(const c of CHART_CATEGORIES)vals.push(Number(x[c.key]||0));}return{hist,max:Math.max(...vals,1)}}
function showChartTip(ev,category,value,run,time,newCount,encodedDetails,encodedServiceCounts){let details=[];try{details=encodedDetails?JSON.parse(decodeURIComponent(encodedDetails)):[]}catch(e){details=[]}let serviceCounts={};try{serviceCounts=encodedServiceCounts?JSON.parse(decodeURIComponent(encodedServiceCounts)):{} }catch(e){serviceCounts={}}const ftth=Number((serviceCounts.FTTH||{})[category]||0);const xdsl=Number((serviceCounts["ADSL/VDSL"]||{})[category]||0);const serviceTotal=ftth+xdsl;const tip=document.getElementById('chartTooltip');let html=`<div class="tt-title">Run #${esc(run)}</div><div class="tt-meta">${esc(time)}</div><div class="tt-row"><span>Category</span><b>${esc(category)}</b></div><div class="tt-row"><span>Tickets This Run</span><b>${n(value)}</b></div><div class="tt-row"><span>FTTH / xDSL</span><b>${n(ftth)} / ${n(xdsl)}</b></div><div class="tt-row"><span>Service Total</span><b>${n(serviceTotal)}</b></div><div class="tt-row"><span>New This Run</span><b>${n(newCount)}</b></div>`;tip.innerHTML=html;tip.style.display='block';tip.style.left=(ev.clientX+16)+'px';tip.style.top=(ev.clientY+16)+'px'}
function hideChartTip(){document.getElementById('chartTooltip').style.display='none'}function bindChartHover(){document.querySelectorAll('.chart-hit').forEach(hit=>{hit.addEventListener('mouseenter',e=>{const el=e.currentTarget;showChartTip(e,el.dataset.category,Number(el.dataset.value||0),el.dataset.run||'',el.dataset.time||'',Number(el.dataset.new||0),el.dataset.details||'',el.dataset.services||'')});hit.addEventListener('mousemove',e=>{const el=e.currentTarget;showChartTip(e,el.dataset.category,Number(el.dataset.value||0),el.dataset.run||'',el.dataset.time||'',Number(el.dataset.new||0),el.dataset.details||'',el.dataset.services||'')});hit.addEventListener('mouseleave',hideChartTip)})}
function toggleCategory(category){if(hiddenCategories.has(category))hiddenCategories.delete(category);else hiddenCategories.add(category);if(lastDashboardData)render(lastDashboardData)}
function buildChart(runs,sessionTotals){const{hist,max}=chartPointData(runs);const W=1100,H=310,L=52,R=24,T=18,B=42,plotW=W-L-R,plotH=H-T-B,xStep=hist.length>1?plotW/(hist.length-1):plotW,xFor=i=>hist.length>1?L+i*xStep:L+plotW/2,yFor=v=>T+plotH-(Number(v||0)/max)*plotH;let grid=[];for(let i=0;i<=4;i++){const y=T+(plotH*i/4),value=Math.round(max-(max*i/4));grid.push(`<line class="chartgrid" x1="${L}" y1="${y}" x2="${W-R}" y2="${y}"/><text class="chartlabel" x="${L-9}" y="${y+4}" text-anchor="end">${n(value)}</text>`)}const xLabels=hist.map((r,i)=>{const x=xFor(i),label=String(r.ended_at||'').slice(11,16)||('R'+r.run_number);return`<text class="chartx" x="${x}" y="${H-15}">${esc(label)}</text>`}).join('');let series='';for(const c of CHART_CATEGORIES){if(hiddenCategories.has(c.key))continue;const pts=hist.map((r,i)=>`${xFor(i)},${yFor((r.dashboard_category_counts||{})[c.key])}`).join(' ');series+=`<polyline class="chartline" style="stroke:${c.color}" points="${pts}"/>`;hist.forEach((r,i)=>{const v=Number((r.dashboard_category_counts||{})[c.key]||0),x=xFor(i),y=yFor(v);const details=((r.dashboard_category_ticket_details||{})[c.key]||[]);const encodedDetails=encodeURIComponent(JSON.stringify(details));const serviceCounts=r.dashboard_service_category_counts||{};const encodedServices=encodeURIComponent(JSON.stringify(serviceCounts));series+=`<circle class="chartdot" style="fill:${c.color}" cx="${x}" cy="${y}" r="5"/><circle class="chart-hit" cx="${x}" cy="${y}" r="12" data-category="${esc(c.key)}" data-value="${v}" data-run="${esc(String(r.run_number))}" data-time="${esc(String(r.ended_at||''))}" data-new="${Number(r.new_ticket_count||0)}" data-details="${encodedDetails}" data-services="${encodedServices}"/>`})}const legend=CHART_CATEGORIES.map(c=>`<div class="legend-item ${hiddenCategories.has(c.key)?'off':''}" onclick="toggleCategory('${esc(c.key)}')" title="Click to ${hiddenCategories.has(c.key)?'show':'hide'} ${esc(c.key)}"><span class="legend-swatch" style="background:${c.color}"></span>${esc(c.key)}</div>`).join('');const totals=(sessionTotals&&sessionTotals.dashboard_category_unique_totals)||{};const serviceTotals=(sessionTotals&&sessionTotals.dashboard_service_category_unique_totals)||{"FTTH":{},"ADSL/VDSL":{}};const iptvSecondPool=(sessionTotals&&sessionTotals.iptv_second_pool_unique_totals)||{};const totalCards=CHART_CATEGORIES.map(c=>{let ftth=Number(serviceTotals.FTTH[c.key]||0),xdsl=Number(serviceTotals["ADSL/VDSL"][c.key]||0);let total=Number(totals[c.key]||0);if(c.key==="IPTV"&&Object.keys(iptvSecondPool).length){ftth=Number(iptvSecondPool.FTTH||0);xdsl=Number(iptvSecondPool["ADSL/VDSL"]||0);total=Number(iptvSecondPool.Total||0)}return`<div class="category-total"><div class="ct-label">${esc(c.key)} · counted today</div><div class="ct-value" style="color:${c.color}">${n(ftth)} / ${n(xdsl)} <span class="ct-arrow">→</span> ${n(total)}</div><div class="ct-service-label">FTTH / xDSL → Total</div></div>`}).join('');const countedTodayTotals=CHART_CATEGORIES.map(c=>c.key==="IPTV"&&Object.keys(iptvSecondPool).length?Number(iptvSecondPool.Total||0):Number(totals[c.key]||0));const totalCountedToday=countedTodayTotals.reduce((sum,v)=>sum+Number(v||0),0);return`<div class="chart"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><line class="chartaxis" x1="${L}" y1="${T}" x2="${L}" y2="${H-B}"/>${grid.join('')}${xLabels}${series}</svg></div><div class="legend">${legend}</div><div class="sub">Each point = one run. Click a category in the legend to hide/show its line. Hover a point to see Run #, time, FTTH / xDSL / Total Tickets This Run and New This Run.</div><div class="category-totals">${totalCards}</div><div class="category-grand-total"><span>Total counted today</span><b>${n(totalCountedToday)}</b></div>`}
function buildDailyCategoryCharts(t){const services=[{key:"FTTH",label:"FTTH"},{key:"ADSL/VDSL",label:"ADSL / VDSL"}];const totals=t.dashboard_service_category_unique_totals||{};const cards=services.map(service=>{const vals=totals[service.key]||{};const max=Math.max(...CHART_CATEGORIES.map(c=>Number(vals[c.key]||0)),1);const rows=CHART_CATEGORIES.map(c=>{const value=Number(vals[c.key]||0);const width=Math.round(value/max*100);const displayLabel=c.key==="IPTV"?"IPTV (Our Pool)":c.key;return`<div class="daily-bar-row"><span class="daily-bar-label">${esc(displayLabel)}</span><div class="daily-bar-track"><div class="daily-bar-fill" style="width:${width}%;background:${c.color}"></div></div><span class="daily-bar-value" style="color:${c.color}">${n(value)}</span></div>`}).join('');const total=CHART_CATEGORIES.reduce((sum,c)=>sum+Number(vals[c.key]||0),0);return`<div class="daily-category-card"><h3>${esc(service.label)} Category Distribution</h3><div class="daily-sub">Unique ticket IDs accumulated for this day</div><div class="daily-bar-list">${rows}</div><div class="daily-chart-total"><span>Total categorized tickets</span><b>${n(total)}</b></div></div>`}).join('');const grandTotal=services.reduce((sum,service)=>sum+CHART_CATEGORIES.reduce((inner,c)=>inner+Number((totals[service.key]||{})[c.key]||0),0),0);return`<div class="daily-category-grid">${cards}</div><div class="daily-chart-grand-total"><span>Total categorized tickets · FTTH + ADSL / VDSL</span><b>${n(grandTotal)}</b></div><div class="sub" style="margin-top:10px">Daily view: Ticket ID + GroupCount is the escalation-event key. Same Ticket + same GroupCount counts once; a changed GroupCount is a new escalation (+1).</div>`}
let selectedDate="";let availableDays=[];const hiddenCategories=new Set();let highGroupSortDesc=true;let currentTicketSortDesc=true;let lastDashboardData=null;function toggleHighGroupSort(){highGroupSortDesc=!highGroupSortDesc;if(lastDashboardData)render(lastDashboardData)}function toggleCurrentTicketSort(){currentTicketSortDesc=!currentTicketSortDesc;if(lastDashboardData)render(lastDashboardData)}
function buildSmartAlerts(t){const alerts=Array.isArray(t.smart_alerts)?t.smart_alerts:[];const critical=alerts.filter(x=>x.severity==="CRITICAL").length,high=alerts.filter(x=>x.severity==="HIGH").length,medium=alerts.filter(x=>x.severity==="MEDIUM").length;const items=alerts.map(x=>`<div class="repeat-item"><div class="panel-title-row"><b>${esc(x.title||'-')}</b><span class="section-badge">${esc(x.severity||'INFO')}</span></div><div class="sub">${esc(x.detail||'')}</div></div>`).join('');return`<div class="panel"><div class="panel-title-row"><h2>🚨 Smart Alert Engine</h2><span class="section-badge">LIVE INTELLIGENCE</span></div><div class="category-totals" style="grid-template-columns:repeat(3,1fr);margin-bottom:10px"><div class="category-total"><div class="ct-label">CRITICAL</div><div class="ct-value bad">${n(critical)}</div></div><div class="category-total"><div class="ct-label">HIGH</div><div class="ct-value" style="color:#ffb36b">${n(high)}</div></div><div class="category-total"><div class="ct-label">MEDIUM</div><div class="ct-value" style="color:#f6c453">${n(medium)}</div></div></div><div class="repeat-list">${items||'<div class="empty">No active smart alerts.</div>'}</div></div>`}
function heatColor(value,max){const ratio=max?Math.min(1,Number(value||0)/max):0;return`background:rgba(85,194,255,${(0.08+ratio*0.72).toFixed(2)})`}

function render(d){lastDashboardData=d;const reportDay=d.session_date||selectedDate||"";const c=d.current||{},t=d.session_totals||{},cats=c.categories||{};const total=Number(c.total_tickets||0),seen=Number(t.unique_accounts_seen||0),runs=(d.runs||[]).length;const max=Math.max(...Object.values(cats).map(Number),1);const rows=(d.runs||[]).slice().reverse().slice(0,12).map(r=>`<tr><td>${esc(r.run_number)}</td><td>${esc(r.ended_at||"")}</td><td>${n(r.total_tickets||0)}</td><td class="ok">+${n(r.new_ticket_count||0)}</td><td>${esc(r.duration_seconds!=null?(Number(r.duration_seconds).toFixed(2)+'s'):r.duration||"")}</td></tr>`).join('');const details=(c.dashboard_category_ticket_details&&typeof c.dashboard_category_ticket_details==='object')?c.dashboard_category_ticket_details:{};const allDetails=Object.values(details).flat();const ticketRows=allDetails.slice().sort((a,b)=>{const av=Number(a.group_count||a.GroupCount||0),bv=Number(b.group_count||b.GroupCount||0);return currentTicketSortDesc?bv-av:av-bv}).slice(0,25).map(x=>`<tr><td>${esc(x.ticket_id||x.ticket||x.id||"")}</td><td>${esc(x.account||x.AccountNum||"")}</td><td>${esc(x.product||x.Product||"")}</td><td>${esc(x.category||x.Category||"")}</td><td>${esc(x.cabinet||x.Cabinet_Host_Name||"")}</td><td>${esc(x.transfer_date||x.transfer_time||"")}</td><td>${n(x.group_count||x.GroupCount||0)}</td></tr>`).join('');const highGroupRows=(t.high_group_tickets||c.high_group_tickets||[]).slice().sort((a,b)=>{const av=Number(a.group_count||a.GroupCount||0),bv=Number(b.group_count||b.GroupCount||0);return highGroupSortDesc?bv-av:av-bv}).slice(0,100).map(x=>`<tr><td>${esc(x.ticket_id||x.ticket||x.id||"")}</td><td>${esc(x.account||x.AccountNum||"")}</td><td>${esc(x.product||x.Product||"")}</td><td>${esc(x.category||x.Category||"")}</td><td>${esc(x.cabinet||x.Cabinet_Host_Name||"")}</td><td>${n(x.group_count||x.GroupCount||0)}</td><td>${esc(x.transfer_time||x.transfer_date||"")}</td><td>${esc(x.first_run||x.first_seen_run||"")}</td><td>${esc(x.last_run||x.last_seen_run||"")}</td></tr>`).join('');const sheetAlerts=c.sheet_repeated_cabinet_alerts||[];const repeatedRows=sheetAlerts.map(x=>`<div class="repeat-item"><div class="panel-title-row"><b>${esc(x.cabinet||'-')}</b><span class="section-badge">${esc(reportDay)}</span></div><div class="sub">${esc((x.sources||[]).join(' · '))} · First seen ${esc(x.detected_at||'-')}${x.last_seen&&x.last_seen!==x.detected_at?' · Last seen '+esc(x.last_seen):''}</div><div class="sub">${(x.cards||[]).length?'💳 Cards: '+esc((x.cards||[]).join(', ')):''}</div><div class="sub">${esc(Object.entries(x.common_comments||{}).map(([a,b])=>a+': '+b).join(' · '))}</div></div>`).join('');const poolHistory=(t.pool_repeated_cabinet_history||[]).map(x=>`<div class="repeat-item"><div class="panel-title-row"><b>${esc(x.cabinet||'-')}</b><span class="section-badge">DAILY</span></div><div class="sub">Run #${esc(x.run_number||'-')} · ${esc(x.detected_at||'-')} · ${n(x.count||0)} occurrences${(x.cards||[]).length?' · Cards: '+esc(x.cards.join(', ')):''}</div></div>`).join('');document.getElementById('sub').textContent=`TTS Pool Operations Intelligence Dashboard · ${reportDay} · Updated ${d.last_updated||'-'}`;document.getElementById('app').innerHTML=`<div class="grid"><div class="card"><div class="label">Current Tickets</div><div class="num accent">${n(total)}</div><div class="sub">Current TTS pool</div></div><div class="card"><div class="label">Tickets Seen Today (#Customers)</div><div class="num">${n(seen)}</div><div class="sub">Unique accounts observed during selected day</div></div><div class="card"><div class="label">New This Run</div><div class="num ok">+${n(c.new_ticket_count||t.new_tickets_this_run||0)}</div><div class="sub">Compared with previous runs</div></div><div class="card"><div class="label">Runs Completed</div><div class="num">${n(runs)}</div><div class="sub">Since dashboard session start</div></div><div class="card"><div class="label">Near Violation</div><div class="num ${Number(c.near_violation)>0?'bad':'ok'}">${n(c.near_violation)}</div><div class="sub">≥ 1h30m age</div></div></div><div class="panel"><h2>Pool Trend · Last 24 Runs</h2>${buildChart(d.runs||[],t)}</div><div class="two"><div><div class="panel"><h2>Pool Composition</h2><div class="bars">${Object.entries(cats).map(([k,v])=>`<div class="barrow"><span>${esc(k)}</span><div class="track"><div class="fill" style="width:${Math.min(100,Number(v)/max*100)}%"></div></div><b>${n(v)}</b></div>`).join('')||'<div class="empty">No data yet</div>'}</div></div>${buildIptvStatusPanel(d)}${buildIptvSecondaryPanel(d)}${buildIptvOurPoolPanel(d)}<div class="panel"><h2>Daily Category Analytics <span class="section-badge">DAILY</span></h2>${buildDailyCategoryCharts(t)}</div></div><div><div class="panel"><h2>Session Intelligence <span class="section-badge">${esc(reportDay)}</span></h2><table class="table"><tr><td>Session started</td><td>${esc(d.started_at||'-')}</td></tr><tr><td>Last update</td><td>${esc(d.last_updated||'-')}</td></tr><tr><td>Peak current pool</td><td><b>${n(t.peak_current_tickets)}</b></td></tr><tr><td>Unique cabinets observed</td><td>${n(t.unique_cabinets_seen)}</td></tr><tr><td>Repeated cabinets (current)</td><td>${n(c.repeated_cabinets)}</td></tr></table></div><div class="panel"><h2>Repeated Cabinet Alerts <span class="section-badge">DAILY</span></h2>${repeatedRows||'<div class="empty">No repeated cabinets detected by the SOC, Logical, or FTTH sheet collectors for this day.</div>'}</div><div class="panel"><h2>TTS Pool Repeated Cabinets <span class="section-badge">DAILY</span></h2><div class="sub">Every cabinet appearing 3+ times is preserved with its run number, detection time and cards for the whole selected day.</div><div class="repeat-list">${poolHistory||'<div class="empty">No repeated cabinet detected in the TTS pool for this day.</div>'}</div></div><div class="panel"><h2>Latest Runs</h2><div class="table-scroll"><table class="table"><thead><tr><th>#</th><th>Time</th><th>Current</th><th>New</th><th>Duration</th></tr></thead><tbody>${rows||'<tr><td colspan="5" class="empty">Waiting for first run...</td></tr>'}</tbody></table></div></div></div></div>${buildSmartAlerts(t)}${buildHourlyHeatmap(t)}${buildRankings(t)}<div class="ticket-layout"><div class="panel ticket-panel"><div class="panel-title-row"><h2>Current Ticket Detail · Top 25</h2><button class="sortbtn" onclick="toggleCurrentTicketSort()">GroupCount: ${currentTicketSortDesc?'DESC ↓':'ASC ↑'}</button></div><div class="table-scroll"><table class="table"><thead><tr><th>Ticket</th><th>Account</th><th>Product</th><th>Category</th><th>Cabinet</th><th>TransferDate</th><th>GroupCount</th></tr></thead><tbody>${ticketRows||'<tr><td colspan="7" class="empty">No ticket details available</td></tr>'}</tbody></table></div></div><div class="panel ticket-panel"><div class="panel-title-row"><h2>High Group Tickets · GroupCount ≥ 5 <span class="section-badge">DAILY</span></h2><button class="sortbtn" onclick="toggleHighGroupSort()">GroupCount: ${highGroupSortDesc?'DESC ↓':'ASC ↑'}</button></div><div class="sub" style="margin-bottom:10px">All unique tickets with GroupCount ≥ 5 detected during the selected day's runs.</div><div class="table-scroll"><table class="table"><thead><tr><th>Ticket</th><th>Account</th><th>Product</th><th>Category</th><th>Cabinet</th><th>GroupCount</th><th>Transfer Time</th><th>First Run</th><th>Last Run</th></tr></thead><tbody>${highGroupRows||'<tr><td colspan="9" class="empty">No tickets with GroupCount ≥ 5 detected today.</td></tr>'}</tbody></table></div></div></div>`}
function loadOnlineStatus(){const el=document.getElementById('onlineStatus');if(!el)return;const count=Array.isArray(window.ANDROID_REPORTS)?window.ANDROID_REPORTS.length:0;el.className='sync-status ' + (count?'ok':'');el.textContent=count?`☁ ${n(count)} online report${count===1?'':'s'} available · Select a Report Day to open it`:'☁ No online reports found'}function loadHistory(){availableDays=Array.isArray(window.ANDROID_REPORTS)?window.ANDROID_REPORTS.map(x=>String(x.date||x)).filter(Boolean):[];const select=document.getElementById('daySelect');select.innerHTML=availableDays.length?availableDays.map(day=>`<option value="${esc(day)}">${esc(day)}</option>`).join(''):'<option value="">No online reports</option>';if(!selectedDate||!availableDays.includes(selectedDate))selectedDate=window.ANDROID_SELECTED_DATE||availableDays[0]||'';select.value=selectedDate;refresh()}function changeDay(day){selectedDate=day||'';if(!selectedDate)return;if(window.Android&&Android.getReportByDate){Android.getReportByDate(selectedDate)}}function refresh(){try{if(window.ANDROID_REPORT_DATA)render(window.ANDROID_REPORT_DATA);else document.getElementById('app').innerHTML='<div class="panel bad">Report data is unavailable.</div>'}catch(e){document.getElementById('app').innerHTML='<div class="panel bad">Unable to render report: '+esc(e.message||e)+'</div>'}}function downloadReport(){window.print()}function logoutDashboard(){if(window.Android&&Android.backHome)Android.backHome();else location.reload()}loadHistory();loadOnlineStatus();
</script></body></html>
